[package]
name = "hello-world-safe"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[target.'cfg(target_os = "android")'.dependencies]
ndk = "0.9.0"
android-activity = { version = "0.6.1", features = [ "native-activity" ] }
log = "0.4.34"
